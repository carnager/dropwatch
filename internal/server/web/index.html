<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dropwatch</title>
<style>
  :root {
    --bg: #faf9f7; --text: #21201d; --muted: #8a877f; --faint: #b5b2aa;
    --line: #e7e5e0; --hover: #f1efeb; --barbg: #e7e5e0;
    --accent: #b3541e; --owned: #4a7c59; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131312; --text: #d9d6cf; --muted: #7d7a72; --faint: #55534d;
      --line: #262522; --hover: #1b1a18; --barbg: #262522;
      --accent: #d97a3d; --owned: #6fa87f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 2.2rem 1.25rem 5rem; }

  header { display: flex; align-items: center; gap: 1.2rem; margin-bottom: .4rem; flex-wrap: wrap; }
  .wordmark { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; }
  .wordmark b { color: var(--accent); font-weight: 700; }
  nav { display: flex; gap: .1rem; }
  header .spring { flex: 1; }
  header label { display: inline-flex; align-items: center; gap: .3rem; font-size: .8rem; color: var(--muted); cursor: pointer; }
  .note { color: var(--muted); font-size: .85rem; margin: .4rem 0 1.4rem; min-height: 1.2em; }

  button {
    border: 0; background: transparent; color: var(--muted); font: inherit;
    font-size: .85rem; cursor: pointer; padding: .25rem .4rem;
  }
  button:hover { color: var(--text); }
  button:disabled { color: var(--faint); cursor: default; }
  button.danger { color: var(--accent); }

  .pill {
    font-size: .78rem; padding: .18rem .6rem; border-radius: 3px;
    color: var(--muted); border: 1px solid transparent;
  }
  .pill.on { color: var(--text); border-color: var(--line); background: var(--hover); }

  input[type=search] {
    padding: .45rem 0; border: 0; border-bottom: 1px solid var(--line);
    background: transparent; color: var(--text); font: inherit; outline: none;
    width: 100%;
  }
  input[type=search]:focus { border-bottom-color: var(--accent); }
  input[type=search]::placeholder { color: var(--faint); }

  .controls { display: flex; align-items: baseline; gap: .5rem; margin: .4rem 0 1.2rem; flex-wrap: wrap; }
  .controls input[type=search] { flex: 1; min-width: 12rem; }

  .sectionhead {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid var(--line); padding-bottom: .4rem; margin: 1.4rem 0 .2rem;
  }
  .sectionhead:first-child { margin-top: 0; }
  .sectionhead h2 {
    margin: 0; font-size: .75rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .09em; color: var(--muted);
  }
  .sectionhead .agg { font-family: var(--mono); font-size: .75rem; color: var(--muted); }

  .row {
    display: flex; align-items: baseline; gap: .8rem;
    padding: .55rem .4rem; margin: 0 -.4rem;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .row:hover { background: var(--hover); }
  .row .name { font-weight: 500; }
  .row .dis { color: var(--faint); font-size: .8rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .spring { flex: 1; }
  .row .bar { width: 72px; height: 3px; background: var(--barbg); border-radius: 2px; align-self: center; flex-shrink: 0; }
  .row .bar i { display: block; height: 100%; background: var(--owned); border-radius: 2px; }
  .row .frac { font-family: var(--mono); font-size: .8rem; color: var(--muted); min-width: 4em; text-align: right; }
  .row .gap { font-family: var(--mono); font-size: .8rem; color: var(--accent); min-width: 6em; text-align: right; }
  .row .gap.done { color: var(--faint); }

  .empty { color: var(--muted); padding: 1.5rem 0; font-size: .9rem; }
  .hint { color: var(--faint); font-size: .82rem; margin-top: 1rem; line-height: 1.6; }

  /* artist detail */
  .crumbs { margin-bottom: 1.6rem; }
  .crumbs button { padding-left: 0; }
  .artisthead { display: flex; align-items: baseline; gap: .9rem; margin-bottom: .3rem; }
  .artisthead h2 { margin: 0; font-size: 1.5rem; letter-spacing: -0.02em; }
  .artisthead .counts { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
  .filters { display: flex; gap: .2rem; align-items: center; margin: 1rem 0 1.2rem; flex-wrap: wrap; }
  .filters .spring { flex: 1; }

  .rel {
    display: flex; align-items: baseline; gap: .8rem;
    padding: .45rem .4rem; margin: 0 -.4rem;
    border-bottom: 1px solid var(--line);
  }
  .rel:hover { background: var(--hover); }
  .rel .year { font-family: var(--mono); font-size: .8rem; color: var(--muted); width: 2.9em; flex-shrink: 0; }
  .rel .artist { color: var(--muted); }
  .rel .title { min-width: 0; }
  .rel .tag {
    font-family: var(--mono); font-size: .68rem; color: var(--faint);
    text-transform: uppercase; letter-spacing: .05em;
  }
  .rel .spring { flex: 1; }
  .rel .src { font-family: var(--mono); font-size: .68rem; color: var(--faint); }
  .rel .st { display: flex; gap: .1rem; visibility: hidden; }
  .rel:hover .st { visibility: visible; }
  .rel .st button { font-size: .78rem; }
  .rel .st button.cur { color: var(--accent); }
  .rel.owned .title { color: var(--muted); }
  .rel.owned::before { content: "✓"; color: var(--owned); font-size: .8rem; width: 0; margin-left: -.9rem; margin-right: .1rem; }
  .rel.ignored { opacity: .45; }
  .rel.ignored .title { text-decoration: line-through; text-decoration-color: var(--faint); }
  .rel.missing .year { color: var(--accent); }

  .hidden { display: none; }
  @media (max-width: 560px) {
    .row .frac, .row .bar, .rel .src { display: none; }
    .rel .st { visibility: visible; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="wordmark">drop<b>watch</b></span>
    <nav>
      <button type="button" class="pill on" data-view="artists">artists</button>
      <button type="button" class="pill" data-view="library">library</button>
      <button type="button" class="pill" data-view="lookup">lookup</button>
    </nav>
    <span class="spring"></span>
    <span id="syncControls"></span>
  </header>
  <div class="note" id="note"></div>

  <!-- ===== artists: the tracked collection, front and center ===== -->
  <div id="artistsView">
    <div class="controls">
      <input type="search" id="artistFilter" placeholder="filter your artists…" autocomplete="off">
      <button type="button" class="pill art-sort" data-s="missing">by missing</button>
      <button type="button" class="pill art-sort on" data-s="name">by name</button>
    </div>
    <div class="sectionhead"><h2>Missing</h2><span class="agg" id="gapsAgg"></span></div>
    <div id="gapsList"></div>
    <div id="completeSection" class="hidden">
      <div class="sectionhead"><h2>Complete</h2><span class="agg" id="completeAgg"></span></div>
      <div id="completeList"></div>
    </div>
  </div>

  <!-- ===== library: everything owned ===== -->
  <div id="libraryView" class="hidden">
    <div class="controls">
      <input type="search" id="libFilter" placeholder="filter artist or title…" autocomplete="off">
      <button type="button" class="pill lib-type on" data-t="Album">albums</button>
      <button type="button" class="pill lib-type on" data-t="EP">eps</button>
      <button type="button" class="pill lib-type" data-t="other">other</button>
      <button type="button" class="pill lib-sort on" data-s="artist">by artist</button>
      <button type="button" class="pill lib-sort" data-s="year">by year</button>
      <button type="button" class="pill lib-sort" data-s="title">by title</button>
    </div>
    <div class="sectionhead"><h2>Library</h2><span class="agg" id="libAgg"></span></div>
    <div id="libList"></div>
  </div>

  <!-- ===== lookup: the only place MusicBrainz gets queried ===== -->
  <div id="lookupView" class="hidden">
    <form id="lookupForm" class="controls">
      <input type="search" id="lookupQ" placeholder="search MusicBrainz for an artist…" autocomplete="off">
      <button type="submit" class="pill">search</button>
    </form>
    <div id="lookupResults"></div>
    <div class="hint">
      This searches MusicBrainz, not your library. Opening a result fetches its
      discography and starts tracking the artist. Use it to follow artists you
      don't have locally yet — your own collection lives under
      <em>artists</em> and <em>library</em>.
    </div>
  </div>

  <!-- ===== artist detail ===== -->
  <div id="artistView" class="hidden">
    <div class="crumbs"><button id="back">← back</button></div>
    <div class="artisthead">
      <h2 id="artistName"></h2>
      <span class="counts" id="artistCounts"></span>
    </div>
    <div class="filters">
      <button type="button" class="pill" data-f="missing">missing only</button>
      <button type="button" class="pill" data-f="variants">variants</button>
      <span class="spring"></span>
      <button type="button" id="syncThis" class="hidden">sync from mpd</button>
      <button type="button" id="refresh">refresh sources</button>
      <button type="button" id="untrack">untrack</button>
    </div>
    <div class="note hidden" id="status"></div>
    <div id="releases"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

/* ---------- view switching ---------- */

const VIEWS = ["artists", "library", "lookup"];
let currentView = "artists";
let lastListView = "artists"; // where "back" from an artist page returns to

// Views live in the URL hash (#artists, #library, #lookup, #artist/<mbid>),
// so browser back/forward work and artist pages are bookmarkable. All
// navigation goes through the hash; render() reacts to hashchange.
function render(name) {
  for (const v of VIEWS) $(v + "View").classList.toggle("hidden", v !== name);
  $("artistView").classList.toggle("hidden", name !== "artist");
  document.querySelectorAll("nav .pill").forEach(p =>
    p.classList.toggle("on", p.dataset.view === name));
  currentView = name;
  if (name !== "artist") lastListView = name;
}

function showView(name) { // navigate: creates a history entry via the hash
  if (name === location.hash.slice(1)) route();
  else location.hash = name;
}

function route() {
  const hash = location.hash.slice(1) || "artists";
  const artistMatch = hash.match(/^artist\/(.+)$/);
  if (artistMatch) {
    render("artist");
    const id = decodeURIComponent(artistMatch[1]);
    if (!currentArtist || currentArtist.id !== id) {
      loadArtist({ id, name: artistNames[id] || "…" });
    }
    return;
  }
  render(VIEWS.includes(hash) ? hash : "artists");
  if (currentView === "artists") loadArtists();
  if (currentView === "library") loadLibrary();
}
window.addEventListener("hashchange", route);

const artistNames = {}; // id → name hints so headers render before the fetch

document.querySelectorAll("nav .pill").forEach(p => {
  p.onclick = () => showView(p.dataset.view);
});

// "/" focuses the active view's input
document.addEventListener("keydown", (e) => {
  if (e.key !== "/" || e.target.tagName === "INPUT") return;
  e.preventDefault();
  const input = { artists: "artistFilter", library: "libFilter", lookup: "lookupQ" }[currentView];
  if (input) $(input).focus();
});

/* ---------- artists view ---------- */

let allArtists = null;
const artistsState = { filter: "", sort: "name" };

$("artistFilter").oninput = () => {
  artistsState.filter = $("artistFilter").value.trim().toLowerCase();
  renderArtists();
};
document.querySelectorAll(".art-sort").forEach(p => {
  p.onclick = () => {
    artistsState.sort = p.dataset.s;
    document.querySelectorAll(".art-sort").forEach(q => q.classList.toggle("on", q === p));
    renderArtists();
  };
});

async function loadArtists() {
  const { artists } = await api("/api/artists");
  allArtists = artists;
  renderArtists();
}

function artistRow(a) {
  const row = el("div", "row");
  row.appendChild(el("span", "name", a.name));
  if (a.disambiguation) row.appendChild(el("span", "dis", a.disambiguation));
  row.appendChild(el("span", "spring"));
  if (a.total !== undefined && a.total > 0) {
    const bar = el("span", "bar");
    const fill = el("i");
    fill.style.width = Math.round(100 * a.owned / a.total) + "%";
    bar.appendChild(fill);
    row.appendChild(bar);
    row.appendChild(el("span", "frac", `${a.owned}/${a.total}`));
    row.appendChild(a.missing > 0
      ? el("span", "gap", `${a.missing} missing`)
      : el("span", "gap done", "complete"));
  }
  row.onclick = () => openArtist(a);
  return row;
}

function renderArtists() {
  if (allArtists === null) return;
  const q = artistsState.filter;
  let rows = allArtists.filter(a =>
    !q || a.name.toLowerCase().includes(q) || (a.disambiguation || "").toLowerCase().includes(q));
  if (artistsState.sort === "name") {
    rows = rows.slice().sort((a, b) => (a.sortName || a.name).localeCompare(b.sortName || b.name));
  } // "missing" keeps server order: most missing first

  const gaps = rows.filter(a => a.missing > 0);
  const complete = rows.filter(a => a.missing === 0);

  const gl = $("gapsList");
  gl.innerHTML = "";
  if (!allArtists.length) {
    gl.appendChild(el("div", "empty", "Nothing tracked yet — sync your player, or add artists via lookup."));
    $("gapsAgg").textContent = "";
  } else if (!gaps.length) {
    gl.appendChild(el("div", "empty", q ? "No matching artists with gaps." : "No gaps. Your collection is complete."));
    $("gapsAgg").textContent = "";
  } else {
    for (const a of gaps) gl.appendChild(artistRow(a));
    const total = gaps.reduce((n, a) => n + a.missing, 0);
    $("gapsAgg").textContent = `${total} releases across ${gaps.length} artists`;
  }

  $("completeSection").classList.toggle("hidden", !complete.length);
  $("completeAgg").textContent = complete.length ? `${complete.length} artists` : "";
  const cl = $("completeList");
  cl.innerHTML = "";
  for (const a of complete) cl.appendChild(artistRow(a));
}

/* ---------- library view ---------- */

let library = null;
const libState = { types: { Album: true, EP: true, other: false }, sort: "artist", filter: "" };

document.querySelectorAll(".lib-type").forEach(p => {
  p.onclick = () => {
    libState.types[p.dataset.t] = !libState.types[p.dataset.t];
    p.classList.toggle("on", libState.types[p.dataset.t]);
    renderLibrary();
  };
});
document.querySelectorAll(".lib-sort").forEach(p => {
  p.onclick = () => {
    libState.sort = p.dataset.s;
    document.querySelectorAll(".lib-sort").forEach(q => q.classList.toggle("on", q === p));
    renderLibrary();
  };
});
$("libFilter").oninput = () => { libState.filter = $("libFilter").value.trim().toLowerCase(); renderLibrary(); };

async function loadLibrary() {
  if (library === null) {
    const d = await api("/api/library");
    library = d.library;
  }
  renderLibrary();
}

function renderLibrary() {
  if (library === null) return;
  const box = $("libList");
  box.innerHTML = "";
  const q = libState.filter;
  let rows = library.filter(e => {
    const t = e.primaryType === "Album" || e.primaryType === "EP" ? e.primaryType : "other";
    if (!libState.types[t]) return false;
    if (q && !e.title.toLowerCase().includes(q) && !e.artistName.toLowerCase().includes(q)) return false;
    return true;
  });
  const date = e => e.firstReleaseDate || "0000";
  if (libState.sort === "year") rows.sort((a, b) => date(b).localeCompare(date(a)));
  else if (libState.sort === "title") rows.sort((a, b) => a.title.localeCompare(b.title));
  // "artist" keeps server order: sort_name, then release date

  $("libAgg").textContent = `${rows.length} of ${library.length} owned`;
  if (!rows.length) {
    box.appendChild(el("div", "empty", library.length ? "Nothing matches the filter." : "Nothing owned yet — sync your player."));
    return;
  }
  const cap = 1500;
  for (const e of rows.slice(0, cap)) {
    const row = el("div", "rel owned");
    row.appendChild(el("span", "year", (e.firstReleaseDate || "").slice(0, 4) || "—"));
    row.appendChild(el("span", "artist", e.artistName));
    row.appendChild(el("span", "title", e.title));
    if (e.primaryType !== "Album") row.appendChild(el("span", "tag", e.primaryType));
    row.appendChild(el("span", "spring"));
    row.style.cursor = "pointer";
    row.onclick = () => openArtist({ id: e.artistId, name: e.artistName });
    box.appendChild(row);
  }
  if (rows.length > cap) {
    box.appendChild(el("div", "empty", `…and ${rows.length - cap} more — narrow the filter to see them.`));
  }
}

/* ---------- lookup view (MusicBrainz) ---------- */

$("lookupForm").onsubmit = async (e) => {
  e.preventDefault();
  const q = $("lookupQ").value.trim();
  if (!q) return;
  const box = $("lookupResults");
  box.innerHTML = "";
  box.appendChild(el("div", "empty", "Searching MusicBrainz…"));
  try {
    const { artists } = await api(`/api/search/artists?q=${encodeURIComponent(q)}`);
    box.innerHTML = "";
    if (!artists.length) box.appendChild(el("div", "empty", "No matches on MusicBrainz."));
    for (const a of artists) box.appendChild(artistRow(a));
  } catch (err) {
    box.innerHTML = "";
    box.appendChild(el("div", "empty", "Search failed: " + err.message));
  }
};

/* ---------- artist detail ---------- */

let currentArtist = null;
let releases = [];
const relFilters = { missing: false, variants: false };

document.querySelectorAll("#artistView .filters .pill[data-f]").forEach(p => {
  p.onclick = () => {
    relFilters[p.dataset.f] = !relFilters[p.dataset.f];
    p.classList.toggle("on", relFilters[p.dataset.f]);
    renderReleases();
  };
});

function stateButton(r, label, state) {
  const b = el("button", r.state === state ? "cur" : "", label);
  b.onclick = async (e) => {
    e.stopPropagation();
    const next = r.state === state ? "" : state;
    await api(`/api/releases/${encodeURIComponent(r.id)}/state`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ state: next }),
    });
    r.state = next;
    r.missing = next === "";
    library = null; // owned set changed; refetch on next library view
    allArtists = null;
    renderReleases();
  };
  return b;
}

function releaseRow(r) {
    const row = el("div", "rel " + (r.state || "missing"));
    row.appendChild(el("span", "year", (r.firstReleaseDate || "").slice(0, 4) || "—"));
    row.appendChild(el("span", "title", r.title));
    if (r.primaryType !== "Album") row.appendChild(el("span", "tag", r.primaryType));
    for (const t of r.secondaryTypes || []) row.appendChild(el("span", "tag", t));
    row.appendChild(el("span", "spring"));
    row.appendChild(el("span", "src",
      (r.sources || []).map(s => s === "musicbrainz" ? "mb" : "dc").join(" ")));
    const st = el("span", "st");
    st.appendChild(stateButton(r, "owned", "owned"));
    st.appendChild(stateButton(r, "ignore", "ignored"));
    row.appendChild(st);
    return row;
}

// The artist page is sectioned: canonical albums, EPs, then variants (live,
// compilations, singles, remixes). Owning something always shows it — owned
// variants appear even with the variants toggle off; the toggle only reveals
// the unowned rest. "missing only" hides owned/ignored canonical entries.
function renderReleases() {
  const box = $("releases");
  box.innerHTML = "";
  const isCanonical = r => !(r.secondaryTypes || []).length &&
    (r.primaryType === "Album" || r.primaryType === "EP");
  const isVariant = r => (r.secondaryTypes || []).length > 0;
  const shown = releases.filter(r => {
    if (r.state === "owned") return true; // what you own is always visible
    if (relFilters.missing && !r.missing) return false;
    if (isVariant(r)) return relFilters.variants;
    return isCanonical(r); // singles etc. never shown unless owned
  });
  const sections = [
    ["Albums", shown.filter(r => r.primaryType === "Album" && !isVariant(r))],
    ["EPs", shown.filter(r => r.primaryType === "EP" && !isVariant(r))],
    ["Live & compilations", shown.filter(r => isVariant(r) || !isCanonical(r))],
  ];

  const canonical = releases.filter(r =>
    isCanonical(r) && (r.primaryType === "Album" || r.primaryType === "EP"));
  const owned = releases.filter(r => r.state === "owned").length;
  const missing = canonical.filter(r => r.missing).length;
  $("artistCounts").textContent = `${owned} owned · ${missing} missing`;

  let any = false;
  for (const [title, rows] of sections) {
    if (!rows.length) continue;
    any = true;
    const head = el("div", "sectionhead");
    head.appendChild(el("h2", "", title));
    head.appendChild(el("span", "agg",
      `${rows.filter(r => r.state === "owned").length}/${rows.length} owned`));
    box.appendChild(head);
    for (const r of rows) box.appendChild(releaseRow(r));
  }
  if (!any) box.appendChild(el("div", "empty", "Nothing to show."));
}

function openArtist(a, refresh = false) {
  artistNames[a.id] = a.name;
  if (refresh || location.hash === "#artist/" + encodeURIComponent(a.id)) {
    loadArtist(a, refresh); // same page: reload without a new history entry
  } else {
    location.hash = "artist/" + encodeURIComponent(a.id); // route() loads it
  }
}

async function loadArtist(a, refresh = false) {
  currentArtist = a;
  render("artist");
  $("artistName").textContent = a.name;
  $("artistCounts").textContent = "";
  $("releases").innerHTML = "";
  const status = $("status");
  status.textContent = refresh
    ? "Re-fetching from sources — rate-limited, this can take a minute…"
    : "Loading…";
  status.classList.remove("hidden");
  try {
    const url = `/api/artists/${a.id}/releases?types=all${refresh ? "&refresh=1" : ""}`;
    const data = await api(url);
    releases = data.releases;
    allArtists = null; // counts may have changed after a fetch
    $("artistName").textContent = data.artist.name;
    artistNames[data.artist.id] = data.artist.name;
    currentArtist = { id: data.artist.id, name: data.artist.name };
    status.classList.add("hidden");
    renderReleases();
  } catch (err) {
    status.textContent = "Failed: " + err.message;
  }
}

$("back").onclick = () => showView(lastListView);
$("refresh").onclick = () => currentArtist && openArtist(currentArtist, true);

// Per-artist pull sync: matches only this artist's albums from the player,
// marking owned ones, then reloads the page. Exact name match server-side.
let syncProvider = null; // set from /api/config below
$("syncThis").onclick = async () => {
  if (!currentArtist || !syncProvider) return;
  const b = $("syncThis");
  b.disabled = true;
  b.textContent = "syncing…";
  const status = $("status");
  try {
    const url = `/api/sync/${syncProvider}?exact=1&artist=${encodeURIComponent(currentArtist.name)}`;
    await api(url, { method: "POST" });
    // Small job (one artist); poll status until it finishes, then reload.
    for (let i = 0; i < 150; i++) {
      await new Promise(res => setTimeout(res, 2000));
      const st = await api("/api/sync/status");
      if (!st.running) {
        status.classList.remove("hidden");
        status.textContent = st.error
          ? "Sync failed: " + st.error
          : (st.total === 0
              ? `No album artist named “${currentArtist.name}” found in ${syncProvider}.`
              : `Synced from ${syncProvider}: ${st.owned} owned, ${st.unmatched} unmatched.`);
        library = null;
        allArtists = null;
        if (st.total > 0) openArtist(currentArtist);
        break;
      }
    }
  } catch (err) {
    status.classList.remove("hidden");
    status.textContent = "Sync failed: " + err.message;
  } finally {
    b.disabled = false;
    b.textContent = "sync from " + syncProvider;
  }
};

let untrackArmed = null;
$("untrack").onclick = async () => {
  const b = $("untrack");
  if (untrackArmed !== currentArtist) {
    untrackArmed = currentArtist;
    b.textContent = "really untrack?";
    b.classList.add("danger");
    setTimeout(() => {
      if (untrackArmed === currentArtist) {
        untrackArmed = null;
        b.textContent = "untrack";
        b.classList.remove("danger");
      }
    }, 4000);
    return;
  }
  try {
    await api(`/api/artists/${currentArtist.id}`, { method: "DELETE" });
    untrackArmed = null;
    b.textContent = "untrack";
    b.classList.remove("danger");
    allArtists = null;
    library = null;
    showView(lastListView);
  } catch (err) {
    $("status").textContent = "Untrack failed: " + err.message;
    $("status").classList.remove("hidden");
  }
};

/* ---------- sync controls ---------- */

api("/api/config").then(c => {
  const providers = [["mpd", c.mpd], ["subsonic", c.subsonic]].filter(p => p[1]).map(p => p[0]);
  if (!providers.length) return;
  syncProvider = providers[0];
  $("syncThis").textContent = "sync from " + syncProvider;
  $("syncThis").classList.remove("hidden");
  const box = $("syncControls");
  const links = [];

  const lbl = el("label", "", "");
  const onlyNew = document.createElement("input");
  onlyNew.type = "checkbox";
  onlyNew.checked = localStorage.getItem("dropwatch.onlyNew") !== "0";
  onlyNew.onchange = () => localStorage.setItem("dropwatch.onlyNew", onlyNew.checked ? "1" : "0");
  lbl.append(onlyNew, " only new");

  function describe(st) {
    const parts = [`${st.owned} owned`, `${st.missing} missing`];
    if (st.skipped) parts.push(`${st.skipped} skipped`);
    if (st.unmatched) parts.push(`${st.unmatched} albums unmatched`);
    if (st.failed) parts.push(`${st.failed} artists failed`);
    return parts.join(", ");
  }
  function setBusy(busy) {
    for (const l of links) {
      l.btn.disabled = busy;
      l.btn.textContent = busy ? "syncing…" : `sync ${l.name}`;
    }
  }
  async function poll() {
    let st;
    try { st = await api("/api/sync/status"); } catch { return; }
    if (st.idle) return;
    if (st.running) {
      setBusy(true);
      $("note").textContent =
        (st.total ? `Syncing ${st.processed}/${st.total}` : "Syncing") +
        (st.current ? ` — ${st.current}` : "") +
        ` · ${describe(st)}`;
      if (st.processed % 5 === 0) { allArtists = null; if (currentView === "artists") loadArtists(); }
      setTimeout(poll, 2000);
    } else {
      setBusy(false);
      $("note").textContent = st.error
        ? `Sync failed: ${st.error}`
        : `Sync finished: ${st.processed} artists — ${describe(st)}.` +
          (st.failed || st.unmatched ? " Details in the server log." : "");
      library = null;
      allArtists = null;
      if (currentView === "artists") loadArtists();
      if (currentView === "library") loadLibrary();
    }
  }
  for (const name of providers) {
    const btn = el("button", "", `sync ${name}`);
    btn.onclick = async () => {
      setBusy(true);
      try {
        const url = `/api/sync/${name}` + (onlyNew.checked ? "?skip_existing=1" : "");
        await api(url, { method: "POST" });
        poll();
      } catch (err) {
        setBusy(false);
        $("note").textContent = `${name} sync failed to start: ` + err.message;
      }
    };
    links.push({ name, btn });
    box.append(btn);
  }
  box.append(lbl);
  poll(); // resume progress display if a sync is already running
}).catch(() => {});

route();
</script>
</body>
</html>
